name: Build EmilyEmotes Fabric 1.20.1

on:
  push:
    branches:
      - emily-emotes-fabric-1.20.1
    paths:
      - 'EmilyEmotes/**'
      - '.github/workflows/emily-emotes-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'EmilyEmotes/**'
      - '.github/workflows/emily-emotes-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registrar ejecución
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/EMILY_EMOTES_LAST_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/EMILY_EMOTES_LAST_RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build EmilyEmotes ${GITHUB_RUN_ID}"
            git push origin HEAD:emily-emotes-fabric-1.20.1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build
        working-directory: EmilyEmotes
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmilyEmotes-1.0.0-Fabric-1.20.1
          path: EmilyEmotes/build/libs/EmilyEmotes-1.0.0.jar
          if-no-files-found: error
