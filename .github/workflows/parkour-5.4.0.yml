name: Compilar ArlightChatClient Parkour 5.4.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/parkour-visuals-5.4.0
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Recuperar fuente completa 5.3.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arlight-source
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=1Kd-P2yF40ZqLuvrD883exz4NSPO45WNy&export=download&confirm=t' \
            --output /tmp/arlight-source.zip
          unzip -q /tmp/arlight-source.zip -d /tmp/arlight-source
          SOURCE_ROOT="$(find /tmp/arlight-source -type f -name build.gradle -printf '%h\n' | head -n 1)"
          test -n "$SOURCE_ROOT"
          rsync -a --delete --exclude '.git' --exclude '.github' "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"

      - name: Aplicar adaptación Parkour 5.4.0
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/parkour-client-5.4.0-patch.tar.gz.b64 > /tmp/parkour-client-patch.tar.gz
          tar -xzf /tmp/parkour-client-patch.tar.gz -C "$GITHUB_WORKSPACE"
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Aplicar hotfix de arranque 5.4.1
        shell: bash
        run: |
          set -euo pipefail
          cp .github/hotfix/ParkourObbyState-5.4.1.java src/main/java/com/arlight/chatclient/ParkourObbyState.java
          sed -i 's/version = "5.4.0"/version = "5.4.1"/' build.gradle
          grep -n 'SubscribeEvent\|void tick' src/main/java/com/arlight/chatclient/ParkourObbyState.java
          grep -n 'version =' build.gradle

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar con Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Verificar hotfix
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          javap -classpath "$JAR" -v com.arlight.chatclient.ParkourObbyState | grep -A3 'RuntimeVisibleAnnotations' | grep 'SubscribeEvent'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep 'version="5.4.1"'

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightChatClient-5.4.1-PARKOUR-STARTUP-FIX-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
