name: Compilar ArlightParkour 1.5.1 Paper API Fix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/parkour-visuals-5.4.0
  pull_request:

permissions:
  contents: read

jobs:
  build-parkour:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Descargar fuente y ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=1GEZZDz-QyA3xzrHWKN4I07GRio_9L4cX&export=download&confirm=t' \
            --output /tmp/parkour-source.zip
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=1b7JV5Y8ymeKdIZIGXwoFQA2JOB9izFqK&export=download&confirm=t' \
            --output /tmp/ArlightCore-1.25.4.jar
          unzip -q /tmp/parkour-source.zip -d /tmp/parkour-src
          SOURCE_ROOT="$(find /tmp/parkour-src -type f -name pom.xml -printf '%h\n' | head -n 1)"
          test -n "$SOURCE_ROOT"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Instalar ArlightCore local
        shell: bash
        run: |
          mvn -B -ntp install:install-file \
            -Dfile=/tmp/ArlightCore-1.25.4.jar \
            -DgroupId=com.arlight \
            -DartifactId=ArlightCore \
            -Dversion=1.25.4 \
            -Dpackaging=jar

      - name: Compilar con Paper API real
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          mvn -B -ntp clean package -DskipTests

      - name: Verificar bytecode y contenido
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' -print -quit)"
          test -n "$JAR"
          javap -classpath "$JAR" -c -p com.arlight.parkour.ArlightParkourPlugin > /tmp/parkour-javap.txt
          grep -A24 'private org.bukkit.inventory.ItemStack icon' /tmp/parkour-javap.txt | tee /tmp/icon-bytecode.txt
          grep -A24 'private org.bukkit.inventory.ItemStack icon' /tmp/parkour-javap.txt | grep 'invokeinterface.*ItemMeta.setDisplayName'
          if grep -A24 'private org.bukkit.inventory.ItemStack icon' /tmp/parkour-javap.txt | grep -q 'invokevirtual.*ItemMeta.setDisplayName'; then
            echo 'ERROR: ItemMeta sigue compilado como clase' >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: el JAR incluye clases org.bukkit' >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep "version: '1.5.1'"
          mkdir -p "$GITHUB_WORKSPACE/dist-parkour"
          cp "$JAR" "$GITHUB_WORKSPACE/dist-parkour/ArlightParkour-1.5.1-REAL-PAPER-API.jar"
          cp /tmp/icon-bytecode.txt "$GITHUB_WORKSPACE/dist-parkour/ICON-BYTECODE-VALIDATION.txt"
          sha256sum "$GITHUB_WORKSPACE/dist-parkour/ArlightParkour-1.5.1-REAL-PAPER-API.jar" > "$GITHUB_WORKSPACE/dist-parkour/SHA256.txt"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ArlightParkour-1.5.1-REAL-PAPER-API
          path: dist-parkour/*
          if-no-files-found: error
          retention-days: 30
