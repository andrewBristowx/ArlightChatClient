name: Construir Parkour 1.6.0 y Client 5.5.0

on:
  push:
    branches:
      - ci/parkour-160-build
    paths-ignore:
      - '.github/build-output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/parkour-160-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4

      - name: Descargar fuentes y ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 'https://drive.usercontent.google.com/download?id=1vTxy9apAAwkYmrTQXNwJQ_RYbuUHFibv&export=download&confirm=t' -o /tmp/parkour-source.zip
          curl --fail --location --retry 5 --retry-delay 3 'https://drive.usercontent.google.com/download?id=17Yrj_TFhvHD4DtRVCnZbAJUl1YkspQgy&export=download&confirm=t' -o /tmp/client-source.zip
          curl --fail --location --retry 5 --retry-delay 3 'https://drive.usercontent.google.com/download?id=1b7JV5Y8ymeKdIZIGXwoFQA2JOB9izFqK&export=download&confirm=t' -o /tmp/ArlightCore-1.25.4.jar
          mkdir -p /tmp/parkour-source /tmp/client-source
          unzip -q /tmp/parkour-source.zip -d /tmp/parkour-source
          unzip -q /tmp/client-source.zip -d /tmp/client-source
          PARKOUR_ROOT="$(find /tmp/parkour-source -type f -name pom.xml -printf '%h\n' | head -n 1)"
          CLIENT_ROOT="$(find /tmp/client-source -type f -name build.gradle -printf '%h\n' | head -n 1)"
          test -n "$PARKOUR_ROOT"
          test -n "$CLIENT_ROOT"
          echo "PARKOUR_ROOT=$PARKOUR_ROOT" >> "$GITHUB_ENV"
          echo "CLIENT_ROOT=$CLIENT_ROOT" >> "$GITHUB_ENV"
          mvn -B -ntp install:install-file -Dfile=/tmp/ArlightCore-1.25.4.jar -DgroupId=com.arlight -DartifactId=ArlightCore -Dversion=1.25.4 -Dpackaging=jar

      - name: Compilar servidor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PARKOUR_ROOT"
          mvn -B -ntp clean test package
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name 'original-*' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep "version: '1.6.0'"
          ! unzip -Z1 "$JAR" | grep -q '^org/bukkit/'
          javap -classpath "$JAR:/tmp/ArlightCore-1.25.4.jar" -p com.arlight.parkour.ArlightParkourPlugin | grep 'generateSafeFallbackCourse'
          javap -classpath "$JAR:/tmp/ArlightCore-1.25.4.jar" -p com.arlight.parkour.ParkourHubManager | grep 'identifyHubItem'
          mkdir -p "$GITHUB_WORKSPACE/.github/build-output"
          cp "$JAR" "$GITHUB_WORKSPACE/.github/build-output/ArlightParkour-1.6.0-HUB-ARENA-REWORK.jar"

      - name: Compilar cliente
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLIENT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          javap -classpath "$JAR" -p com.arlight.chatclient.ParkourHubState | grep 'accept'
          javap -classpath "$JAR" -p com.arlight.chatclient.ParkourGalleryRenderer | grep 'fallbackX'
          cp "$JAR" "$GITHUB_WORKSPACE/.github/build-output/ArlightChatClient-5.5.0-PARKOUR-HUB-REWORK.jar"

      - name: Guardar resultados en la rama temporal
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sha256sum .github/build-output/*.jar > .github/build-output/SHA256.txt
          printf 'OK\n' > .github/build-output/BUILD_SUCCESS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-output
          git commit -m 'Guardar JARs compilados [skip ci]'
          git push origin HEAD:ci/parkour-160-build
