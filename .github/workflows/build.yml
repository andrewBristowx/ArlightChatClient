name: Compilar Parkour Live Tops

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/LAST_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/LAST_RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar fuentes finales
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local id="$1" out="$2"
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$out"
          }
          download '1EG4yifuiujLFUjnUacEPAlrsEDo8zdLd' /tmp/client.zip
          download '1O0FMkO3yPNtNcNtsFfmxgDbVZdxKL7yP' /tmp/parkour.zip
          download '1PAd2BUK7h3YQSZYLBEJ7C0ElzqqBq5wK' /tmp/assets.zip
          download '1d9sjeHwVDOB1hxVubQg_jOZ6CwKh_y60' /tmp/ArlightCore-1.25.4.jar
          unzip -t /tmp/ArlightCore-1.25.4.jar >/dev/null
          mkdir -p /tmp/client /tmp/parkour /tmp/assets
          unzip -q /tmp/client.zip -d /tmp/client
          unzip -q /tmp/parkour.zip -d /tmp/parkour
          unzip -q /tmp/assets.zip -d /tmp/assets
          echo "CLIENT_ROOT=$(find /tmp/client -type f -name build.gradle -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"
          echo "PARKOUR_ROOT=$(find /tmp/parkour -type f -name pom.xml -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"
          echo "ASSETS_ROOT=$(find /tmp/assets -type f -name build.gradle -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - name: Instalar ArlightCore local
        shell: bash
        run: |
          mvn -B -ntp install:install-file \
            -Dfile=/tmp/ArlightCore-1.25.4.jar \
            -DgroupId=com.arlight \
            -DartifactId=ArlightCore \
            -Dversion=1.25.4 \
            -Dpackaging=jar

      - name: Compilar ArlightParkour 1.8.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$PARKOUR_ROOT"
          mvn -B -ntp clean test package
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name 'original-*' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep "version: '1.8.0'"
          if unzip -Z1 "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: Bukkit embebido en plugin'
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$JAR" "$GITHUB_WORKSPACE/dist/ArlightParkour-1.8.0-LIVE-TOPS.jar"

      - name: Compilar ArlightParkourAssets 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$ASSETS_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -E '1\.2\.0|version'
          cp "$JAR" "$GITHUB_WORKSPACE/dist/ArlightParkourAssets-1.2.0-TEXTURE-UPGRADE.jar"

      - name: Compilar ArlightChatClient 5.7.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLIENT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -E '5\.7\.0|version'
          unzip -l "$JAR" | grep 'textures/parkour/lobby/top_race.png'
          unzip -l "$JAR" | grep 'com/arlight/chatclient/BingoLobbyTopRenderer.class'
          cp "$JAR" "$GITHUB_WORKSPACE/dist/ArlightChatClient-5.7.0-PARKOUR-LIVE-TOPS.jar"

      - name: Verificación final
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          sha256sum dist/* | tee dist/SHA256.txt
          javap -classpath dist/ArlightChatClient-5.7.0-PARKOUR-LIVE-TOPS.jar -p com.arlight.chatclient.ParkourGalleryRenderer >/dev/null
          javap -classpath dist/ArlightChatClient-5.7.0-PARKOUR-LIVE-TOPS.jar -p com.arlight.chatclient.BingoLobbyTopRenderer >/dev/null

      - name: Subir entrega compilada
        uses: actions/upload-artifact@v4
        with:
          name: ArlightParkour-1.8.0-Assets-1.2.0-ChatClient-5.7.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
